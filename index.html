<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muskel-Coach">
<title>Muskel-Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14;--card:#141a22;--card2:#1b232d;--line:#26303c;--text:#eef2f6;--muted:#8d99a8;
  --accent:#ff6a1a;--accent2:#ffb02e;--good:#22c55e;--blue:#3b82f6;--danger:#ef4444;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.3px;margin:0}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0b0f14 70%,rgba(11,15,20,.85));padding:calc(12px + var(--safe-t)) 16px 10px;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:21px;box-shadow:0 4px 14px rgba(255,106,26,.35)}
.brand h1{font-size:26px;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:Inter}
main{padding:14px 14px calc(96px + var(--safe-b));max-width:760px;margin:0 auto}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(17,22,29,.96);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b));backdrop-filter:blur(10px)}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:12px;cursor:pointer}
nav.tabs button .i{font-size:21px;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--text);background:var(--card2)}
nav.tabs button.on .i{filter:none;opacity:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px}
.sectiontitle h2{font-size:22px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .15s}
.ex:active{transform:scale(.97)}
.ex .thumb{background:radial-gradient(120% 90% at 50% 20%,#212b37,#10151b);aspect-ratio:300/270;display:block}
.ex .thumb svg{width:100%;height:100%;display:block}
.ex .meta{padding:9px 11px 11px}
.ex .meta b{display:block;font-size:14.5px;line-height:1.25}
.ex .meta span{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,106,26,.15);color:var(--accent2);margin:2px 4px 0 0}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;width:100%;font-size:15.5px}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.ghost{background:none;border:1px solid var(--danger);color:var(--danger)}
.btn.sm{width:auto;padding:8px 12px;font-size:13.5px;border-radius:11px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
.input:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card2);color:var(--text)}
.stat{background:var(--card2);border-radius:14px;padding:12px;text-align:center}
.stat .v{font-family:"Barlow Condensed";font-size:30px;font-weight:800;line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:9px;border-radius:6px;background:var(--bg);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--good);transition:width .3s}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .mini{width:72px;height:72px;border-radius:10px;background:#10151b;flex:none;overflow:hidden;cursor:pointer}
.item .mini svg{width:100%;height:100%}
.item .body{flex:1;min-width:0}
.item .body b{display:block;font-size:14.5px;line-height:1.25}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:none;flex:none;cursor:pointer;display:grid;place-items:center;font-size:17px;color:#fff}
.check.on{background:var(--good);border-color:var(--good)}
.iconbtn{background:var(--card2);border:1px solid var(--line);border-radius:10px;width:32px;height:32px;cursor:pointer;flex:none;font-size:14px;color:var(--muted)}
.inl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.smallin{width:58px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:5px 6px;font-size:14px;text-align:center}
.warmup{background:linear-gradient(135deg,rgba(59,130,246,.18),rgba(34,197,94,.12));border:1px solid rgba(59,130,246,.35)}
.credit{text-align:center;color:var(--muted);font-size:12.5px;margin:22px 0 6px}
.credit b{color:var(--accent2)}
/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex;animation:fadeo .2s}
@keyframes fadeo{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;border:1px solid var(--line);padding:0 0 calc(16px + var(--safe-b));animation:up .25s ease}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.sheethead{position:sticky;top:0;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);z-index:2}
.sheethead h3{font-size:22px}
.close{background:var(--card2);border:0;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--text)}
.stage{background:radial-gradient(110% 80% at 50% 15%,#26313f,#0d1116 75%);position:relative}
.stage svg{width:100%;display:block;max-height:46vh}
.stagectl{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.stagectl button{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer}
.legend{position:absolute;left:10px;bottom:10px;font-size:11.5px;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:8px;color:#ffd0c8}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff3b30;margin-right:5px;vertical-align:-1px}
.pad{padding:14px 16px}
ol.steps{padding-left:20px;margin:6px 0 0}ol.steps li{margin:5px 0}
ul.tl{padding-left:18px;margin:6px 0 0}ul.tl li{margin:4px 0}
.h4{font-weight:700;margin-top:14px;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent2)}
.vlink{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:#c4302b;color:#fff;font-weight:700;border-radius:14px;padding:12px;margin-top:14px}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;width:calc(100% - 32px);max-width:420px;margin:auto;animation:up .2s}
.overlay.center{align-items:center}
.pickrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.pickrow:first-child{border-top:0}
.pickrow .mini{width:64px;height:64px;border-radius:9px;background:#10151b;flex:none;overflow:hidden}
.pickrow .mini svg{width:100%;height:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));background:#222c38;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.foodq{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.foodq button{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:7px 10px;font-size:13px;cursor:pointer}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">💪</div>
    <div><h1>MUSKEL-COACH</h1><small id="hello">Dein Trainer für Muskelaufbau</small></div>
  </div>
</header>

<main>
  <!-- ÜBUNGEN -->
  <section class="view" id="v-uebungen">
    <div class="chips" id="groupChips"></div>
    <div class="grid" id="exGrid"></div>
  </section>

  <!-- PLAN -->
  <section class="view" id="v-plan">
    <div class="seg" id="daySeg" style="margin-bottom:12px"></div>
    <div id="planBox"></div>
  </section>

  <!-- ERNÄHRUNG -->
  <section class="view" id="v-ernaehrung">
    <div id="foodBox"></div>
  </section>

  <!-- PROFIL -->
  <section class="view" id="v-profil">
    <div id="profileBox"></div>
  </section>

  <div class="credit">Entwickler © by <b>Cem Inönlü</b></div>
</main>

<nav class="tabs" id="tabs">
  <button data-v="uebungen"><span class="i">🏋️</span>Übungen</button>
  <button data-v="plan"><span class="i">📋</span>Mein Plan</button>
  <button data-v="ernaehrung"><span class="i">🥩</span>Ernährung</button>
  <button data-v="profil"><span class="i">👤</span>Profil</button>
</nav>

<div class="overlay" id="sheetOv"><div class="sheet" id="sheet"></div></div>
<div class="overlay center" id="dlgOv"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================
   1. Figur-Engine (SVG, seitliche Ansicht, schattiert)
   ========================================================= */
const R = Math.PI/180, G = 250;
const L = {torso:72, neck:10, head:12, ua:40, fa:36, th:52, sh:50};
const dirA = a => [Math.sin(a*R), Math.cos(a*R)];            // Winkel: 0 = nach unten, 90 = nach vorn
const add = (p,v,s=1) => [p[0]+v[0]*s, p[1]+v[1]*s];
const nrm = d => [d[1], -d[0]];                                // Vorderseite einer Gliedmaße
const fx = n => (Math.round(n*10)/10);
const P = p => fx(p[0])+','+fx(p[1]);

function geo(p){
  const hip=[p.hx,p.hy];
  const td=[Math.sin(p.t*R), -Math.cos(p.t*R)];
  const tn=[-td[1], td[0]];
  const sho=add(hip,td,L.torso+(p.shr||0));
  const head=add(add(sho,td,L.neck+L.head-1),tn,2.5);
  const arm=(ua,fa,off)=>{const s=add(sho,tn,off);const e=add(s,dirA(ua),L.ua);const h=add(e,dirA(fa),L.fa);return {s,ua,fa,e,h};};
  const leg=(th,sh,ft,off)=>{const hp=add(hip,tn,off);const k=add(hp,dirA(th),L.th);const f=add(k,dirA(sh),L.sh);return {hp,th,sh,k,f,ft:ft||0};};
  return {hip,td,tn,sho,head,
    near:arm(p.ua,p.fa,0), far:arm(p.fua??p.ua, p.ffa??p.fa,-3),
    nl:leg(p.th,p.sh,p.ft,0), fl:leg(p.fth??p.th, p.fsh??p.sh, p.ft,-2)};
}
function smooth(pts){
  const n=pts.length, mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  let s='M'+P(mid(pts[n-1],pts[0]));
  for(let i=0;i<n;i++) s+='Q'+P(pts[i])+' '+P(mid(pts[i],pts[(i+1)%n]));
  return s+'Z';
}
function seg(p1,d,n,len,prof){
  const f=prof.map(([u,a])=>add(add(p1,d,len*u),n,a));
  const b=prof.map(([u,,c])=>add(add(p1,d,len*u),n,c)).reverse();
  return smooth(f.concat(b));
}
const PROF = {
  torso:[[-0.1,12.5,-13.5],[0.1,12.5,-17],[0.33,12,-13.5],[0.6,16,-16.5],[0.82,21,-18],[1.02,12,-14]],
  ua:[[0,9.5,-10],[0.45,10.5,-10],[1,6,-6.5]],
  fa:[[0,7,-7],[0.28,8.2,-7.5],[1,4.6,-4.6]],
  th:[[0,14,-15],[0.42,14.5,-13],[1,8.5,-8]],
  sh:[[0,8,-8],[0.32,7,-10.5],[1,4.6,-4.6]],
  neck:[[0,6.5,-7.5],[1,5.5,-5.5]],
  shorts:[[-0.14,14,-15],[0.2,14,-18.5]],
  shortsLeg:[[-0.18,15,-16.5],[0.36,15,-14.5]]
};
const REG = {
  chest:['t',.8,1,12,8], abs:['t',.36,1,15,6], lats:['t',.62,-1,17,7], lowback:['t',.2,-1,12,6],
  glutes:['t',.06,-1,10,9], traps:['t',.97,-1,9,6], shoulder:['sho'],
  biceps:['ua',.5,1,13,5.5], triceps:['ua',.5,-1,13,5.5], forearm:['fa',.33,0,11,5.5],
  quads:['th',.5,1,19,7.5], hams:['th',.5,-1,18,7], calves:['sh',.3,-1,13,5]
};
const HW = {t:13,ua:9,fa:6,th:13,sh:7};
function region(key,g){
  const r=REG[key]; if(!r) return '';
  if(r[0]==='sho'){const c=g.sho; return `<circle cx="${fx(c[0])}" cy="${fx(c[1])}" r="12" class="hl"/>`;}
  let p1,d,len;
  if(r[0]==='t'){p1=g.hip;d=g.td;len=L.torso;}
  else if(r[0]==='ua'){p1=g.near.s;d=dirA(g.near.ua);len=L.ua;}
  else if(r[0]==='fa'){p1=g.near.e;d=dirA(g.near.fa);len=L.fa;}
  else if(r[0]==='th'){p1=g.nl.hp;d=dirA(g.nl.th);len=L.th;}
  else {p1=g.nl.k;d=dirA(g.nl.sh);len=L.sh;}
  const n = r[0]==='t' ? g.tn : nrm(d);
  const c=add(add(p1,d,len*r[1]),n,r[2]*HW[r[0]]*0.55);
  const ang=Math.atan2(d[1],d[0])/R;
  return `<ellipse cx="${fx(c[0])}" cy="${fx(c[1])}" rx="${r[3]}" ry="${r[4]}" transform="rotate(${fx(ang)} ${fx(c[0])} ${fx(c[1])})" class="hl"/>`;
}
function legSVG(l,far){
  const sk=far?'url(#skF)':'url(#sk)', sh=far?'#16255a':'url(#shorts)';
  const dT=dirA(l.th), dS=dirA(l.sh);
  let s=`<path d="${seg(l.hp,dT,nrm(dT),L.th,PROF.th)}" fill="${sk}"/>`;
  s+=`<path d="${seg(l.k,dS,nrm(dS),L.sh,PROF.sh)}" fill="${sk}"/>`;
  s+=`<circle cx="${fx(l.k[0])}" cy="${fx(l.k[1])}" r="8.3" fill="${sk}"/>`;
  s+=`<path d="${seg(l.hp,dT,nrm(dT),L.th,PROF.shortsLeg)}" fill="${sh}"/>`;
  // Schuh
  const fr=nrm(dS), a=l.ft*R, toe=[fr[0]*Math.cos(a)-fr[1]*Math.sin(a), fr[0]*Math.sin(a)+fr[1]*Math.cos(a)];
  const heel=add(l.f,toe,-4), tip=add(l.f,toe,14);
  s+=`<line x1="${fx(heel[0])}" y1="${fx(heel[1])}" x2="${fx(tip[0])}" y2="${fx(tip[1])}" stroke="${far?'#1a1a1a':'#2b2f36'}" stroke-width="9" stroke-linecap="round"/>`;
  s+=`<line x1="${fx(heel[0])}" y1="${fx(heel[1])+3}" x2="${fx(tip[0])}" y2="${fx(tip[1])+3}" stroke="${far?'#444':'#e8e8e8'}" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>`;
  return s;
}
function armSVG(a,far){
  const sk=far?'url(#skF)':'url(#sk)';
  const dU=dirA(a.ua), dF=dirA(a.fa);
  let s=`<path d="${seg(a.s,dU,nrm(dU),L.ua,PROF.ua)}" fill="${sk}"/>`;
  s+=`<path d="${seg(a.e,dF,nrm(dF),L.fa,PROF.fa)}" fill="${sk}"/>`;
  s+=`<circle cx="${fx(a.e[0])}" cy="${fx(a.e[1])}" r="6.6" fill="${sk}"/>`;
  s+=`<circle cx="${fx(a.h[0])}" cy="${fx(a.h[1])}" r="5.8" fill="${sk}"/>`;
  s+=`<circle cx="${fx(a.s[0])}" cy="${fx(a.s[1])}" r="${far?10:12}" fill="${far?'url(#skF)':'url(#delt)'}"/>`;
  return s;
}
function torsoSVG(g){
  let s=`<path d="${seg(g.hip,g.td,g.tn,L.torso,PROF.torso)}" fill="url(#skT)"/>`;
  // Bauchmuskel- und Brustandeutung
  const ab=(u,o)=>add(add(g.hip,g.td,L.torso*u),g.tn,o);
  const c1=ab(.73,15),c2=ab(.62,11),c3=ab(.5,10.5),c4=ab(.3,10);
  s+=`<path d="M${P(c1)} Q${P(ab(.66,9))} ${P(c2)}" stroke="rgba(90,40,15,.35)" stroke-width="1.6" fill="none"/>`;
  s+=`<path d="M${P(c3)} L${P(ab(.5,6))} M${P(ab(.4,10.3))} L${P(ab(.4,6))} M${P(c4)} L${P(ab(.3,6))}" stroke="rgba(90,40,15,.3)" stroke-width="1.3"/>`;
  s+=`<path d="${seg(g.hip,g.td,g.tn,L.torso,PROF.shorts)}" fill="url(#shorts)"/>`;
  s+=`<path d="${seg(g.sho,g.td,g.tn,L.neck+5,PROF.neck)}" fill="url(#sk)"/>`;
  return s;
}
function headSVG(g){
  const h=g.head, hair=add(add(h,g.tn,-2.2),g.td,1.8), face=add(h,g.tn,1.2);
  const eye=add(add(h,g.tn,8),g.td,2), ear=add(add(h,g.tn,-2),g.td,-1);
  return `<circle cx="${fx(hair[0])}" cy="${fx(hair[1])}" r="12.4" fill="#2a1a10"/>
  <circle cx="${fx(face[0])}" cy="${fx(face[1])}" r="11.4" fill="url(#sk)"/>
  <ellipse cx="${fx(ear[0])}" cy="${fx(ear[1])}" rx="2.6" ry="3.6" fill="#b86f43"/>
  <circle cx="${fx(eye[0])}" cy="${fx(eye[1])}" r="1.4" fill="#2a1a10"/>`;
}
function toolSVG(ex,g){
  const t=ex.tool, h=g.near.h, fh=g.far.h; let s='';
  if(t==='dumbbell'){
    for(const [p,f] of [[fh,1],[h,0]]){s+=`<rect x="${fx(p[0]-8)}" y="${fx(p[1]-8)}" width="16" height="16" rx="5" fill="${f?'#1f2329':'#353b44'}" stroke="${f?'#2c3138':'#59616d'}" stroke-width="1.5"/>`;}
  } else if(t==='barbell'){
    s+=`<circle cx="${fx(h[0])}" cy="${fx(h[1])}" r="17" fill="#22262c" stroke="#4a515c" stroke-width="3"/><circle cx="${fx(h[0])}" cy="${fx(h[1])}" r="3" fill="#aab"/>`;
  } else if(t==='cable'||t==='rope'){

function openEx(id){
  const e=EXM[id];
  const MUS={chest:'Brust',abs:'Bauch',lats:'Latissimus',lowback:'unterer Rücken',glutes:'Po',traps:'Nacken/Trapez',shoulder:'Schulter',biceps:'Bizeps',triceps:'Trizeps',forearm:'Unterarm',quads:'Oberschenkel vorn',hams:'Oberschenkel hinten',calves:'Waden'};

   <div class="stage"><div id="stageSvg"></div>
     <div class="legend"><i></i>${e.targets.map(t=>MUS[t]).join(' · ')}</div>
     <div class="stagectl"><button id="spd">1×</button><button id="pp">⏸</button></div></div>
   <div class="pad">
     <div>${'<span class="tag">'+GNAME[e.g]+'</span>'}<span class="tag">${esc(e.eq)}</span><span class="tag">${esc(e.sets)} Sätze × ${esc(e.reps)}</span></div>
     <div class="h4">So geht's</div><ol class="steps">${e.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
     <div class="h4">Tipps</div><ul class="tl">${e.tips.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
     <div class="h4">Typische Fehler</div><ul class="tl">${e.mistakes.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
     <a class="vlink" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">▶ Echtes Video auf YouTube ansehen</a>
     <div style="height:10px"></div>
     <button class="btn" id="addToPlan">＋ Zu meinem Plan hinzufügen</button>
   </div>`;
  openSheet();
  stopAnim();
  const box=$('#stageSvg'); let speed=1, playing=true, t0=performance.now(), acc=0, last=t0;
  const T=2600;
  function frame(now){
    if(playing) acc+=(now-last)*speed; last=now;
    const ph=(acc%T)/T, e2=0.5-0.5*Math.cos(ph*2*Math.PI);
    box.innerHTML=figure(e,e2);
    anim.raf=requestAnimationFrame(frame);
  }
  anim={raf:requestAnimationFrame(frame)};
  $('#pp').onclick=()=>{playing=!playing;$('#pp').textContent=playing?'⏸':'▶';};
  $('#spd').onclick=()=>{speed=speed===1?0.5:speed===0.5?1.5:1;$('#spd').textContent=(speed===0.5?'0,5':speed===1.5?'1,5':'1')+'×';};
  $('#addToPlan').onclick=()=>chooseDay(id);
}

$('#planBox').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const day=S.plan[S.day], items=day.items, i=items.findIndex(x=>x.id===b.dataset.id);
  const a=b.dataset.act;
  if(a==='open') return openEx(b.dataset.ex);
  if(a==='done'){const t=today();S.done[t]=S.done[t]||{};S.done[t][b.dataset.id]=!S.done[t][b.dataset.id];if(!S.done[t][b.dataset.id])delete S.done[t][b.dataset.id];
    // alte Tage aufräumen
    for(const k of Object.keys(S.done)) if(k!==t) delete S.done[k];
    save();renderPlan();
    const dn=S.done[t]||{}; if(items.length&&items.every(x=>dn[x.id])) toast('💪 Training geschafft – stark!');

const GOALS={aufbau:{l:'Muskelaufbau',kcal:300,p:2.0},halten:{l:'Halten',kcal:0,p:1.8},defi:{l:'Definieren',kcal:-400,p:2.2}};
function calc(){
  const p=S.profile, w=+p.weight||0, h=+p.height||0, a=+p.age||0;
  const bmr=10*w+6.25*h-5*a+(p.sex==='m'?5:-161);
  const tdee=bmr*(+p.act||1.55);
  const g=GOALS[p.goal]||GOALS.aufbau;
  const kcal=Math.round((tdee+g.kcal)/10)*10;
  const prot=Math.round(w*g.p);
  const fat=Math.round(w*0.9);
  const carbs=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  const krea=Math.round(w/10*2)/2;  // 1 g pro 10 kg, auf 0,5 g gerundet
  const water=Math.round((w*0.035+0.5)*10)/10;
  return {bmr,tdee,kcal,prot,fat,carbs,krea,water,g};
}
const QUICK=[['Hähnchenbrust 150 g',165,35],['Magerquark 250 g',168,30],['3 Eier',230,19],['Haferflocken 80 g',300,11],['Reis gekocht 200 g',260,5],['Whey-Shake (Wasser)',120,24],['Thunfisch Dose',130,28],['Banane',110,1],['Skyr 200 g',125,22],['Rinderhack 150 g',375,30]];
function renderFood(){
  const c=calc(), t=today(), log=S.food[t]||[];
  const sumK=log.reduce((a,x)=>a+x.k,0), sumP=log.reduce((a,x)=>a+x.p,0);
  const pct=(v,m)=>Math.min(100,m?v/m*100:0);
  let h=`<div class="sectiontitle"><h2>Dein Tagesbedarf</h2><span class="muted" style="font-size:13px">${c.g.l}</span></div>
  <div class="stats">
    <div class="stat"><div class="v" style="color:var(--accent2)">${de(c.kcal)}</div><div class="l">kcal pro Tag</div></div>
    <div class="stat"><div class="v" style="color:#60a5fa">${de(c.prot)} g</div><div class="l">Eiweiß (${de(c.g.p,1)} g/kg)</div></div>
    <div class="stat"><div class="v" style="color:var(--good)">${de(c.krea,1)} g</div><div class="l">Kreatin (1 g / 10 kg)</div></div>
    <div class="stat"><div class="v" style="color:#38bdf8">${de(c.water,1)} l</div><div class="l">Wasser</div></div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="kv"><span class="muted">Grundumsatz</span><b>${de(c.bmr)} kcal</b></div>
    <div class="kv"><span class="muted">Gesamtumsatz</span><b>${de(c.tdee)} kcal</b></div>
    <div class="kv"><span class="muted">Kohlenhydrate</span><b>${de(c.carbs)} g</b></div>
    <div class="kv"><span class="muted">Fett</span><b>${de(c.fat)} g</b></div>
    <p class="hint">Berechnet aus deinem Profil (Mifflin-St Jeor). ${S.profile.goal==='aufbau'?'Für Muskelaufbau +300 kcal Überschuss.':''} Richtwerte – keine medizinische Beratung.</p>
  </div>
  <div class="sectiontitle"><h2>Heute gegessen</h2></div>
  <div class="card">
    <div class="row"><div><label class="f">Kalorien</label><b style="font-size:18px">${de(sumK)} / ${de(c.kcal)}</b><div class="bar"><i style="width:${pct(sumK,c.kcal)}%;background:${sumK>c.kcal*1.1?'var(--danger)':'var(--accent)'}"></i></div></div>
    <div><label class="f">Eiweiß</label><b style="font-size:18px">${de(sumP)} / ${de(c.prot)} g</b><div class="bar"><i style="width:${pct(sumP,c.prot)}%;background:#60a5fa"></i></div></div></div>
    <div class="h4">Schnell hinzufügen</div>
    <div class="foodq" id="quick">${QUICK.map((q,i)=>`<button data-q="${i}">${esc(q[0])}</button>`).join('')}</div>
    <div class="h4">Eigener Eintrag</div>
    <div class="row" style="margin-top:6px"><input class="input" id="fN" placeholder="z. B. Mittagessen"></div>
    <div class="row" style="margin-top:8px"><input class="input" id="fK" placeholder="kcal" inputmode="numeric"><input class="input" id="fP" placeholder="Eiweiß g" inputmode="decimal"><button class="btn" id="fAdd" style="flex:none;width:auto">＋</button></div>
    <div style="margin-top:10px">${log.map((x,i)=>`<div class="item"><div class="body"><b>${esc(x.n)}</b><span class="muted" style="font-size:12.5px">${de(x.k)} kcal · ${de(x.p)} g Eiweiß</span></div><button class="iconbtn" data-rm="${i}">✕</button></div>`).join('')||'<p class="muted" style="margin:6px 0 0">Noch nichts eingetragen.</p>'}</div>
  </div>`;
  $('#foodBox').innerHTML=h;
  const push=(n,k,p)=>{(S.food[t]=S.food[t]||[]).push({n,k,p});for(const d of Object.keys(S.food))if(d<addDaysKey(t,-30))delete S.food[d];save();renderFood();};
  $('#quick').onclick=e=>{const b=e.target.closest('[data-q]');if(!b)return;const q=QUICK[+b.dataset.q];push(q[0],q[1],q[2]);toast('Eingetragen ✓');};
  $('#fAdd').onclick=()=>{const n=$('#fN').value.trim()||'Eintrag',k=num($('#fK').value),p=num($('#fP').value);if(!(k>=0)){toast('Bitte kcal eingeben');return;}push(n,Math.round(k),p>=0?Math.round(p):0);};
  $('#foodBox').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.food[t].splice(+b.dataset.rm,1);save();renderFood();});
}
function addDaysKey(k,n){const [y,m,d]=k.split('-').map(Number);const dt=new Date(y,m-1,d+n);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}

/* =========================================================
   8. Profil
   ========================================================= */
function renderProfile(){
  const p=S.profile;
  const ACT=[[1.375,'Leicht aktiv (1–3× Training)'],[1.55,'Aktiv (3–5× Training)'],[1.725,'Sehr aktiv (6–7× / körperliche Arbeit)']];
  $('#profileBox').innerHTML=`
  <div class="sectiontitle"><h2>Dein Profil</h2></div>
  <div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div><label class="f">Name</label><input class="input" id="pName" value="${esc(p.name)}" placeholder="Dein Name"></div>
    <div><label class="f">Geschlecht</label><div class="seg" id="pSex"><button data-v="m" class="${p.sex==='m'?'on':''}">Männlich</button><button data-v="w" class="${p.sex==='w'?'on':''}">Weiblich</button></div></div>
    <div class="row">
      <div><label class="f">Alter</label><input class="input" id="pAge" value="${p.age}" inputmode="numeric"></div>
      <div><label class="f">Gewicht kg</label><input class="input" id="pW" value="${String(p.weight).replace('.',',')}" inputmode="decimal"></div>
      <div><label class="f">Größe cm</label><input class="input" id="pH" value="${p.height}" inputmode="numeric"></div>
    </div>
    <div><label class="f">Aktivität</label><select class="input" id="pAct">${ACT.map(([v,l])=>`<option value="${v}" ${+p.act===v?'selected':''}>${l}</option>`).join('')}</select></div>
    <div><label class="f">Ziel</label><div class="seg" id="pGoal">${Object.entries(GOALS).map(([k,g])=>`<button data-v="${k}" class="${p.goal===k?'on':''}">${g.l}</button>`).join('')}</div></div>
    <button class="btn" id="pSave">Speichern & berechnen</button>
  </div>
  <div class="card">
    <b>📱 Als App auf dem Handy</b>
    <p class="hint" style="margin-top:6px"><b>iPhone:</b> Link in Safari öffnen → Teilen-Symbol → „Zum Home-Bildschirm“.<br><b>Android:</b> Link in Chrome öffnen → Menü ⋮ → „Zum Startbildschirm hinzufügen“.<br>Deine Daten bleiben nur auf deinem Gerät gespeichert.</p>
  </div>
  <button class="btn ghost" id="pReset">Alle Daten löschen</button>`;
  let sex=p.sex, goal=p.goal;
  $('#pSex').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;sex=b.dataset.v;$('#pSex').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));};
  $('#pGoal').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;goal=b.dataset.v;$('#pGoal').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));};
  $('#pSave').onclick=()=>{
    const age=num($('#pAge').value), w=num($('#pW').value), h=num($('#pH').value);
    if(!(age>=12&&age<=100&&w>=30&&w<=300&&h>=120&&h<=230)){dialog('<h3 style="font-size:22px">Bitte Angaben prüfen</h3><p class="muted">Alter 12–100, Gewicht 30–300 kg, Größe 120–230 cm.</p>',[{text:'OK'}]);return;}
    S.profile={name:$('#pName').value.trim(),sex,age:Math.round(age),weight:w,height:Math.round(h),act:+$('#pAct').value,goal};
    save();greet();toast('Gespeichert ✓');location.hash='ernaehrung';show('ernaehrung');
  };
  $('#pReset').onclick=()=>dialog('<h3 style="font-size:22px">Alle Daten löschen?</h3><p class="muted">Profil, Plan und Ernährungstagebuch werden auf diesem Gerät gelöscht.</p>',[{text:'Löschen',cls:'ghost',on:()=>{S=JSON.parse(JSON.stringify(DEF));S.plan=defaultPlan();save();greet();renderProfile();toast('Zurückgesetzt');}},{text:'Abbrechen',cls:'sec'}]);
}
function greet(){$('#hello').textContent=S.profile.name?`Hallo ${S.profile.name} – heute wird trainiert!`:'Dein Trainer für Muskelaufbau';}

greet();
show((location.hash||'').slice(1)||'uebungen');
</script>
</body>
