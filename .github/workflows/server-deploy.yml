name: Server bereitstellen (Cloudflare)
# Legt bei Cloudflare die Datenbank an, veröffentlicht worker/muskel-worker.js und setzt die Geheimnisse.
# Benötigte Repository-Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, MC_ADMIN_KEY (mind. 12 Zeichen)
on:
  push:
    branches: [main, stats-cloudflare]
    paths: ['worker/**', '.github/workflows/server-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: server-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MC_ADMIN_KEY: ${{ secrets.MC_ADMIN_KEY }}
      FDC_API_KEY: ${{ secrets.FDC_API_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      NAME: muskel-coach-server
      DBNAME: muskel-coach-db
    steps:
      - name: Voraussetzungen prüfen
        run: |
          # Leerzeichen, Zeilenumbrüche und Anführungszeichen aus kopierten Werten entfernen (bleiben maskiert)
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MC_ADMIN_KEY; do
            t=$(printf '%s' "${!v}" | tr -d '[:space:]"'"'"); [ -n "$t" ] && echo "::add-mask::$t"; export $v="$t"; echo "$v=$t" >> $GITHUB_ENV
          done
          echo "Token: Länge ${#CLOUDFLARE_API_TOKEN}, beginnt mit ${CLOUDFLARE_API_TOKEN:0:5}… · Account-ID: Länge ${#CLOUDFLARE_ACCOUNT_ID} · Admin-Schlüssel: Länge ${#MC_ADMIN_KEY}"
          ok=1
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::warning::Secret CLOUDFLARE_API_TOKEN fehlt"; ok=0; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::warning::Secret CLOUDFLARE_ACCOUNT_ID fehlt"; ok=0; }
          [ ${#MC_ADMIN_KEY} -ge 6 ] || { echo "::warning::Secret MC_ADMIN_KEY fehlt oder ist kürzer als 6 Zeichen"; ok=0; }
          if [ $ok = 1 ]; then
            r=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            echo "$r" | jq -e '.success==true' >/dev/null || r=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            echo "$r" | jq '{success, status: .result.status, errors}'
            echo "$r" | jq -e '.success==true' >/dev/null || { echo "::error::Cloudflare-Token ungültig"; exit 1; }
          fi
          echo "READY=$ok" >> $GITHUB_ENV
          [ $ok = 1 ] || echo "### ⏸️ Übersprungen – Secrets fehlen noch" >> $GITHUB_STEP_SUMMARY
      - uses: actions/checkout@v4
        if: env.READY == '1'
      - uses: actions/setup-node@v4
        if: env.READY == '1'
        with: { node-version: 20 }
      - name: Wrangler installieren
        if: env.READY == '1'
        run: npm i -g wrangler@4 >/dev/null 2>&1 && wrangler --version
      - name: Datenbank anlegen (falls noch nicht vorhanden)
        if: env.READY == '1'
        run: |
          id=$(wrangler d1 list --json | jq -r --arg n "$DBNAME" '.[]|select(.name==$n)|.uuid' | head -1)
          if [ -z "$id" ]; then wrangler d1 create "$DBNAME" --location weur; id=$(wrangler d1 list --json | jq -r --arg n "$DBNAME" '.[]|select(.name==$n)|.uuid' | head -1); fi
          [ -n "$id" ] || { echo "::error::Datenbank konnte nicht angelegt werden (Token braucht D1: Edit)"; exit 1; }
          echo "DBID=$id" >> $GITHUB_ENV; echo "Datenbank: $DBNAME ($id)"
      - name: workers.dev-Adresse sicherstellen
        if: env.READY == '1'
        run: |
          A="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          sub=$(curl -s "$A" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            for cand in muskel-coach muskelcoach "muskel-coach-${CLOUDFLARE_ACCOUNT_ID:0:6}"; do
              r=$(curl -s -X PUT "$A" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' -d "{\"subdomain\":\"$cand\"}")
              if echo "$r" | jq -e '.success==true' >/dev/null; then sub=$cand; break; fi; echo "$r" | jq -c '.errors'
            done
          fi
          [ -n "$sub" ] || { echo "::error::Keine workers.dev-Adresse"; exit 1; }
          echo "SUB=$sub" >> $GITHUB_ENV
      - name: Worker veröffentlichen
        if: env.READY == '1'
        run: |
          cat > wrangler.toml <<TOML
          name = "$NAME"
          main = "worker/muskel-worker.js"
          compatibility_date = "2025-09-01"
          workers_dev = true
          [[d1_databases]]
          binding = "DB"
          database_name = "$DBNAME"
          database_id = "$DBID"
          TOML
          wrangler deploy
      - name: Geheimnisse setzen
        if: env.READY == '1'
        run: |
          printf '%s' "$MC_ADMIN_KEY" | wrangler secret put ADMIN_KEY --name "$NAME"
          if [ -n "$AZURE_SPEECH_KEY" ]; then printf '%s' "$AZURE_SPEECH_KEY" | tr -d ' \r\n' | wrangler secret put AZURE_SPEECH_KEY --name "$NAME"; printf '%s' "${AZURE_SPEECH_REGION:-westeurope}" | tr -d ' \r\n' | tr 'A-Z' 'a-z' | wrangler secret put AZURE_SPEECH_REGION --name "$NAME"; fi
          if [ -n "$FDC_API_KEY" ]; then printf '%s' "$FDC_API_KEY" | tr -d ' \r\n' | wrangler secret put FDC_API_KEY --name "$NAME"; fi
          if ! wrangler secret list --name "$NAME" | grep -q '"SALT"'; then openssl rand -hex 32 | tr -d '\n' | wrangler secret put SALT --name "$NAME"; fi
      - name: Test
        if: env.READY == '1'
        run: |
          URL="https://$NAME.$SUB.workers.dev"
          for i in 1 2 3 4 5 6; do t=$(curl -s "$URL/" || true); [ "$t" = "Dr. Muskel Coach Server läuft" ] && break; sleep 10; done
          echo "Antwort: $t"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/admin/stats" -H 'Content-Type: application/json' -d '{}')
          ok=$(curl -s -X POST "$URL/admin/stats" -H "Authorization: Bearer $MC_ADMIN_KEY" -H 'Content-Type: application/json' -d '{"k":["users"]}' | jq -r '.ok')
          echo "Ohne Schlüssel: HTTP $code (erwartet 401) · mit Schlüssel: ok=$ok"
          { echo "### ✅ Server läuft"; echo "Adresse: **$URL**"; echo "Antwort: $t · ohne Schlüssel HTTP $code · mit Schlüssel ok=$ok"; } >> $GITHUB_STEP_SUMMARY
          [ "$t" = "Dr. Muskel Coach Server läuft" ] && [ "$code" = "401" ] && [ "$ok" = "true" ]
      - name: Lebensmittel-Suche testen
        if: env.READY == '1'
        run: |
          URL="https://$NAME.$SUB.workers.dev"
          { echo "### 🍎 Lebensmittel-Suche"; echo "| Anfrage | Treffer | Zeit | Quellen |"; echo "|---|---|---|---|"; } >> $GITHUB_STEP_SUMMARY
          fail=0
          for q in "skyr" "haferflocken" "chicken breast" "milbona skyr" "döner" "magerquark" "ja! toastbrot" "coca cola zero" "rewe beste wahl pizza" "oat milk"; do
            s=$(date +%s%3N); r=$(curl -s -G "$URL/food/search" --data-urlencode "q=$q"); e=$(( $(date +%s%3N) - s ))
            n=$(echo "$r" | jq -r '.n // "FEHLER"'); src=$(echo "$r" | jq -c '.src // .error'); first=$(echo "$r" | jq -r '[.items[:2][]? | "\(.n) (\(.kcal) kcal, \(.src))"] | join("; ")')
            echo "$q → $n Treffer, ${e} ms, $src | $first"
            echo "| $q | $n | ${e} ms | $src |" >> $GITHUB_STEP_SUMMARY
            [ "$q" = "skyr" ] && [ "$n" = "FEHLER" ] && fail=1
          done
          s=$(date +%s%3N); r=$(curl -s -G "$URL/food/search" --data-urlencode "q=skyr"); e=$(( $(date +%s%3N) - s )); echo "skyr (2. Mal, Cache) → $(echo "$r" | jq -r '.cached') ${e} ms"
          echo "| skyr (Cache) | $(echo "$r" | jq -r '.n') | ${e} ms | cached=$(echo "$r" | jq -r '.cached') |" >> $GITHUB_STEP_SUMMARY
          for c in 3017620422003 4056489190381 5449000000996; do r=$(curl -s "$URL/food/ean/$c"); echo "EAN $c → $(echo "$r" | jq -c '{ok,cached,n:.item.n,kcal:.item.kcal}')"; echo "| EAN $c | $(echo "$r" | jq -r '.item.n // "–"') | | $(echo "$r" | jq -r '.item.kcal // "–"') kcal |" >> $GITHUB_STEP_SUMMARY; done
          [ "$fail" = "0" ]
      - name: Coach-Stimmen testen
        if: env.READY == '1'
        run: |
          URL="https://$NAME.$SUB.workers.dev"
          st=$(curl -s "$URL/tts"); echo "Status: $st"; en=$(echo "$st" | jq -r '.enabled')
          { echo "### 🔊 Coach-Stimmen"; echo "Premium-Stimmen aktiv: **$en**"; } >> $GITHUB_STEP_SUMMARY
          if [ "$en" = "true" ]; then
            for v in mia luna leon alex; do
              for i in 1 2; do s=$(date +%s%3N); code=$(curl -s -o /tmp/$v.mp3 -w '%{http_code} %{size_download}' -X POST "$URL/tts" -H 'Content-Type: application/json' -d "{\"text\":\"Hey, schön, dass du wieder da bist. Heute steht Brusttraining auf deinem Plan.\",\"voice\":\"$v\",\"lang\":\"de\",\"mood\":\"start\"}"); e=$(( $(date +%s%3N) - s ))
                echo "$v Versuch $i: HTTP/Bytes $code, ${e} ms"; case "$code" in 200*) ;; *) echo "Antwort: $(head -c 200 /tmp/$v.mp3)";; esac; echo "| $v | Versuch $i | $code | ${e} ms |" >> $GITHUB_STEP_SUMMARY; done
            done
          fi
