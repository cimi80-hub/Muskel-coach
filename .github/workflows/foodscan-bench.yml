name: FoodScan Phase 2 – Benchmark
on:
  push:
    branches: [foodscan]
    paths: ['tools/foodscan/**', '.github/workflows/foodscan-bench.yml']
permissions:
  contents: write
concurrency:
  group: foodscan-bench
  cancel-in-progress: true
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Abhängigkeiten
        run: |
          mkdir -p /tmp/fs && cd /tmp/fs && npm init -y >/dev/null && npm i --onnxruntime-node-install-cuda=skip @huggingface/transformers@3 2>&1 | tail -1
          pip install pyarrow >/dev/null 2>&1 && echo pyarrow ok
      - name: Merkmal-Cache laden
        uses: actions/cache/restore@v4
        with:
          path: /tmp/fscache
          key: n5k-feat-v2-${{ github.run_id }}
          restore-keys: n5k-feat-v2-
      - name: Text-Embeddings (neue Klassen)
        env: { N_DISH: '0' }
        run: ln -sf /tmp/fs/node_modules node_modules && node tools/foodscan/build.mjs 2>&1 | tail -3
      - name: Benchmark Nutrition5k (offizielle Splits)
        env: { N_TRAIN: '3000', N_TEST: '9999', DEPTH: '0' }
        run: node tools/foodscan/bench.mjs 2>&1 | tee /tmp/bench.log | grep -vE '^\s+"?-?[0-9]' | tail -400
      - name: Merkmal-Cache speichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/fscache
          key: n5k-feat-v2-${{ github.run_id }}
      - name: Erkennung Food-101 (unabhängig)
        run: python3 tools/foodscan/f101.py 20 && node tools/foodscan/f101.mjs 2>&1 | tail -150
      - name: Ergebnisse speichern
        if: always()
        run: |
          rm -f node_modules
          find foodscan/models -name "*.onnx" ! -name "vision_model_quantized.onnx" ! -path "*depth-anything*" -delete
          git config user.name "foodscan-bot"; git config user.email "actions@github.com"
          git add foodscan; git commit -m "FoodScan Phase 2: Benchmark-Ergebnisse" || true
          git pull --rebase -X theirs || true; git push
