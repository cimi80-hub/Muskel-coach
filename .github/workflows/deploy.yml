
name: Muskel-Coach Web-App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Expo Web-App erstellen
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_BASE_URL: /Muskel-coach

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Web-App hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Webseite veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
